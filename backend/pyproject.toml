[tool.poetry]
package-mode = false

[project]
name = "backend"
version = "0.1.1"
description = ""
authors = [
    {name = "Vladislava Zhuikova",email = "vladazhuikova@gmail.com"}
]
requires-python = ">=3.12"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.136.0"
uvicorn = "^0.41.0"
dotenv = "^0.9.9"
pydantic-settings = "^2.13.1"
sqlalchemy = "^2.0.48"


[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
ruff = "^0.15.11"
mypy = "^1.19.1"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
plugins = ["sqlalchemy.ext.mypy.plugin"]
