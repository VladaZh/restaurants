apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: restaurants
data:
  vector.yml: |
    data_dir: /vector-data-dir
    sources:
      k8s:
        type: kubernetes_logs
        extra_namespace_label_selector: kubernetes.io/metadata.name=restaurants
    transforms:
      msg_parser:
        type: remap
        inputs: [k8s]
        source: |
          parsed, err = parse_json(.message)
          if err == null && is_object(parsed) {
            . = merge(., object!(parsed))
          }

          msg = string(.message) ?? string(.msg) ?? string(.log) ?? ""
          if msg == "" {
            msg = encode_json(.)
          }
          ._msg = msg
    sinks:
      vlogs:
        type: elasticsearch
        inputs: [msg_parser]
        endpoints: [http://victoria-logs.restaurants.svc.cluster.local:9428/insert/elasticsearch/]
        mode: bulk
        api_version: v8
        compression: gzip
        healthcheck:
          enabled: false
        request:
          headers:
            VL-Stream-Fields: kubernetes.pod_namespace,kubernetes.pod_name,kubernetes.container_name
            VL-Time-Field: timestamp
            VL-Msg-Field: _msg
            AccountID: "0"
            ProjectID: "0"