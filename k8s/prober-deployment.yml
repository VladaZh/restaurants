apiVersion: apps/v1
kind: Deployment
metadata:
  name: prober
  namespace: restaurants
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prober
  template:
    metadata:
      labels:
        app: prober
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: prober
          image: sre-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/prober.py"]
          ports:
            - name: metrics
              containerPort: 8001
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi