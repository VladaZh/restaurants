apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - image: sre-backend:latest
        imagePullPolicy: IfNotPresent
        name: backend
        ports:
          - containerPort: 8000
        env:
          - name: DB_URL
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: DB_URL