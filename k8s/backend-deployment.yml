apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
      labels:
        app: backend
    spec:
      containers:
      - image: sre-backend:latest
        imagePullPolicy: IfNotPresent
        name: backend
        ports:
          - containerPort: 8000
        env:
          - name: DB_URL
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: DB_URL
          - name: CHAOS_ERROR_RATE
            value: "0"
          - name: CHAOS_DELAY_MS
            value: "0"
        readinessProbe:
          httpGet:
            path: /metrics
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5