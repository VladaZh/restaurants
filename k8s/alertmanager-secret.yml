apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: restaurants
type: Opaque
stringData:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: telegram
      group_by: [alertname]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
      routes:
        - matchers:
            - severity="critical"
          receiver: telegram
          repeat_interval: 30m

    receivers:
      - name: telegram
        telegram_configs:
          - bot_token: "6250115052:AAFIPqnOYE93puHDfqtQItYaj08uQD_dSsc"
            chat_id: 968413228
            send_resolved: true

    inhibit_rules:
      - source_matchers:
          - alertname="PostgresDown"
        target_matchers:
          - alertname=~"ReservationErrorsHigh|ApiProbeFailing"
