apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: restaurants
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://victoria-logs:9428
        isDefault: true
        editable: true
