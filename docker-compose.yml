services:

  db:
    image: postgres:16.13-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_URL: ${DB_URL}
    ports:
      - "5432:5432"
    volumes:
      - restaurants_app_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  logs:
    image: victoriametrics/victoria-logs:v1.53.0
    ports:
     - "9428:9428"
    command:
      - "--storageDataPath=/restaurants-logs-data"
    volumes:
      - restaurants-logs-data:/restaurants-logs-data
    restart: always

  vector:
    image: docker.io/timberio/vector:0.59.0-alpine
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: /var/lib/docker
        target: /var/lib/docker
      - ./vector-vl-single.yml:/etc/vector/vector.yaml:ro
    depends_on: [ logs ]
    ports:
      - "8686:8686"
    user: root
    restart: always

  frontend:
    build: 
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL}

volumes:
  restaurants_app_data:
  restaurants-logs-data:
